name: E2E (live full-stack)

# 라이브 백엔드 풀스택(Postgres·Redis·Kafka 3-node·kafka-connect·LocalStack + carry-app bootRun)을
# 띄우고 Playwright UI-level E2E를 돌린다. 무겁고 외부(backend repo) 의존이라 **일반 PR을 차단하지
# 않는다** — nightly·수동·`e2e` 라벨 PR에서만 실행한다. 일반 PR 게이트는 ci.yml(Lint·Typecheck·Test·Build).
#
# 백엔드(carry-platform)는 public 리포라 기본 GITHUB_TOKEN으로 체크아웃한다 — 시크릿 불요.
# 과거엔 private 전제로 PAT 시크릿(`CARRY_PLATFORM_REPO_TOKEN`)을 요구했으나 끝내 등록되지 않아,
# main 승격(#104) 이후 야간 실행이 매일 체크아웃 단계에서 `Input required and not supplied: token`
# 으로 실패했다. 백엔드를 다시 private으로 돌리면 PAT를 `token:`으로 넘겨야 한다.

on:
  schedule:
    - cron: '0 18 * * *' # 매일 (UTC) — 일반 PR과 분리된 야간 회귀
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: live full-stack E2E
    # PR은 'e2e' 라벨이 붙은 경우에만(일반 PR 비차단). schedule·dispatch는 항상 실행.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_URL: http://localhost:8081
      PG_DSN: postgresql://carry:carry@localhost:5432/carry

    steps:
      - name: Checkout carry-app (frontend·e2e)
        uses: actions/checkout@v4
        with:
          # 야간(schedule) 실행은 기본 브랜치(main)의 워크플로 파일로 돌지만 검증 대상은 통합 브랜치
          # develop 이다. 백엔드도 develop 을 받으므로 양쪽을 맞춘다 — main 을 받으면 승격 전 develop 의
          # 계약 변화와 어긋나 거짓 실패가 난다. PR·수동 실행은 기본값(그 이벤트의 ref)을 쓴다.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Checkout carry-platform (backend)
        uses: actions/checkout@v4
        with:
          repository: Coinlaundryapp/carry-platform
          ref: develop
          path: backend

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Start infra (postgres·redis·kafka·connect·localstack)
        working-directory: backend
        run: docker compose up -d postgres redis kafka-1 kafka-2 kafka-3 kafka-connect localstack

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec carry-postgres pg_isready -U carry -d carry >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"; docker logs carry-postgres --tail 50; exit 1

      - name: Start backend (bootRun, local 프로파일=스텁 PG)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SERVER_PORT: '8081'
          # Spring Boot 4 에서 management.tracing.enabled 는 지원 종료(무시됨) — 내보내기를 끄는 키는
          # management.tracing.export.enabled 다. 켜져 있으면 OTLP exporter 가 없는 수집기(4318)로 계속
          # 내보내려다 요청을 늦춘다(로컬 실측: E2E 1.5분 → 4.0분, "Failed to export spans" 46회).
          MANAGEMENT_TRACING_EXPORT_ENABLED: 'false'
          # 환불 보상 스위퍼를 가속해 refund 여정이 합리적 시간에 REFUNDED에 도달하게 한다.
          CARRY_PAYMENT_REFUND_RETRY_INTERVAL_MS: '5000'
        run: |
          nohup ./gradlew :carry-app:bootRun > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo "backend pid $!"

      - name: Wait for backend health (Flyway 스키마 마이그레이션 포함)
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8081/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "backend UP"; exit 0
            fi
            sleep 5
          done
          echo "backend not healthy"; tail -120 "$GITHUB_WORKSPACE/backend.log"; exit 1

      - name: Seed (service_areas·schedules·price policies)
        # 스키마는 백엔드 기동 시 Flyway가 만든다(local 도 ddl-auto:validate) → 기동 후 주입한다.
        run: docker exec -i carry-postgres psql -U carry -d carry < backend/carry-loadtest/src/gatling/resources/seed.sql

      - name: Register Debezium outbox connector
        # connector json은 로컬(Docker Desktop)용 host.docker.internal을 쓴다 → CI(compose 네트워크)에선
        # 컨테이너명 carry-postgres로 치환한다. outbox_events 테이블은 백엔드 Flyway가 만든 뒤라야 한다.
        run: |
          sed 's/host\.docker\.internal/carry-postgres/g' backend/infra/debezium/register-connector.json > /tmp/connector.json
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/conn-resp.json -w '%{http_code}' -X POST http://localhost:8083/connectors \
              -H 'Content-Type: application/json' --data @/tmp/connector.json || true)
            if [ "$code" = "201" ] || [ "$code" = "409" ]; then echo "connector registered ($code)"; break; fi
            echo "connect not ready ($code), retrying…"; sleep 3
          done
          cat /tmp/conn-resp.json || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm --filter @carry/e2e exec playwright install --with-deps chromium

      - name: Run E2E (api + customer/carrier/coordinator UI)
        run: pnpm --filter @carry/e2e e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Dump backend log on failure
        if: failure()
        run: tail -200 "$GITHUB_WORKSPACE/backend.log" || true
